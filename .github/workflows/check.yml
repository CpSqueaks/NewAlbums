name: Check Deezer for new albums

on:
  schedule:
    # Friday 14:00 UTC = 7:00 AM PDT (8:00 AM PST during winter).
    - cron: '0 14 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write

# Only one run at a time per workflow. Anything that overlaps gets queued.
# Prevents two concurrent runs from each posting the same alert before
# either has had a chance to commit the updated seen.json.
concurrency:
  group: check-deezer
  cancel-in-progress: false

env:
  # Opt in to Node.js 24 for JS-based actions (silences the Node 20
  # deprecation warning; GitHub will force this on June 2, 2026 anyway).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new releases
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_releases.py

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist_ids.json seen.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update tracking state [skip ci]"
            git push
          fi
